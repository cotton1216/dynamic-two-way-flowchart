<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 650" role="img" aria-label="双向动态流程图模板：编号顺序动画与明暗主题" aria-describedby="timingNote">
  <desc id="timingNote">编号不等于严格时序图：编号与动画表示逻辑调用顺序，不代表真实耗时、精确时间比例或完整的并发时序。</desc>
  <style>
    text { font-family: "PingFang SC", "SF Pro Text", system-ui, sans-serif; }
    /* 深色主题（默认） */
    :root {
      --c-bg: #010207;
      --c-grid: rgba(129,157,225,0.10);
      --c-node: #0B0F1E;
      --c-node-line: #2A3556;
      --c-core: #12224F;
      --c-phase-1: #9274D8;
      --c-phase-2: #4E8F94;
      --c-phase-3: #819DE1;
      --c-ret: #5C6784;
      --c-ret-glow: #6C7796;
      --c-ret-core: #A9B3C9;
      --c-text: #D3D6E1;
      --c-sub: #8A93A8;
      --c-accent: #7FB3B8;
      --c-auth: #B7A0EA;
      --c-disc: #7FB3B8;
      --c-invoke: #A8BEF0;
      --c-hud: #24304F;
      --c-node-a: #819DE1;
      --c-node-b: #9274D8;
      --c-node-c: #55B89A;
      --c-node-d: #D6AC62;
      --c-node-e: #CC7FA3;
      --c-core-line: #3154B5;
    }
    /* 浅色主题（手动） */
    :root[data-theme="light"] {
      --c-bg: #F4F7FB;
      --c-grid: rgba(59,130,246,0.07);
      --c-node: #FFFFFF;
      --c-node-line: #CBD5E1;
      --c-core: #E7F6EE;
      --c-phase-1: #7C3AED;
      --c-phase-2: #0D9488;
      --c-phase-3: #2563EB;
      --c-ret: #94A3B8;
      --c-ret-glow: #94A3B8;
      --c-ret-core: #64748B;
      --c-text: #1E293B;
      --c-sub: #64748B;
      --c-accent: #0F766E;
      --c-auth: #6D28D9;
      --c-disc: #0F766E;
      --c-invoke: #2563EB;
      --c-hud: #CBD5E1;
      --c-node-a: #2563EB;
      --c-node-b: #7C3AED;
      --c-node-c: #0D9488;
      --c-node-d: #D97706;
      --c-node-e: #DB2777;
      --c-core-line: #3B82F6;
    }
    /* 深色主题（手动覆盖系统） */
    :root[data-theme="dark"] {
      --c-bg: #010207;
      --c-grid: rgba(129,157,225,0.10);
      --c-node: #0B0F1E;
      --c-node-line: #2A3556;
      --c-core: #12224F;
      --c-phase-1: #9274D8;
      --c-phase-2: #4E8F94;
      --c-phase-3: #819DE1;
      --c-ret: #5C6784;
      --c-ret-glow: #6C7796;
      --c-ret-core: #A9B3C9;
      --c-text: #D3D6E1;
      --c-sub: #8A93A8;
      --c-accent: #7FB3B8;
      --c-auth: #B7A0EA;
      --c-disc: #7FB3B8;
      --c-invoke: #A8BEF0;
      --c-hud: #24304F;
      --c-node-a: #819DE1;
      --c-node-b: #9274D8;
      --c-node-c: #55B89A;
      --c-node-d: #D6AC62;
      --c-node-e: #CC7FA3;
      --c-core-line: #3154B5;
    }
    /* 跟随系统：系统为浅色且未手动指定时用浅色 */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --c-bg: #F4F7FB;
        --c-grid: rgba(59,130,246,0.07);
        --c-node: #FFFFFF;
        --c-node-line: #CBD5E1;
        --c-core: #E7F6EE;
        --c-phase-1: #7C3AED;
        --c-phase-2: #0D9488;
        --c-phase-3: #2563EB;
        --c-ret: #94A3B8;
        --c-ret-glow: #94A3B8;
        --c-ret-core: #64748B;
        --c-text: #1E293B;
        --c-sub: #64748B;
        --c-accent: #0F766E;
        --c-auth: #6D28D9;
        --c-disc: #0F766E;
        --c-invoke: #2563EB;
        --c-hud: #CBD5E1;
        --c-node-a: #2563EB;
        --c-node-b: #7C3AED;
        --c-node-c: #0D9488;
        --c-node-d: #D97706;
        --c-node-e: #DB2777;
        --c-core-line: #3B82F6;
      }
    }
    .nodeText { fill: var(--c-text); font-size: 14px; font-weight: 500; }
    .nodeSub { fill: var(--c-sub); font-size: 12px; }
    .nodeAccent { fill: var(--c-accent); font-size: 12px; font-weight: 500; }
    .labAuth { fill: var(--c-auth); font-size: 12px; font-weight: 500; }
    .labDisc { fill: var(--c-disc); font-size: 12px; font-weight: 500; }
    .labInvoke { fill: var(--c-invoke); font-size: 12px; font-weight: 500; }
    .labMuted { fill: var(--c-ret-core); font-size: 12px; }
    .badge { fill: var(--c-bg); stroke: currentColor; stroke-width: 1.5; }
    .stepNumber { fill: var(--c-text); font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .note { fill: var(--c-sub); font-size: 11px; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
    }
    .themeBtn { cursor: pointer; }
    .themeBtn:hover { opacity: 0.85; }
    @keyframes dashFlow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .particles { opacity: 0; } }
  </style>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1.0" fill="var(--c-grid)" />
    </pattern>
    <marker id="arrAuth" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--c-phase-1)" />
    </marker>
    <marker id="arrDisc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--c-phase-2)" />
    </marker>
    <marker id="arrInvoke" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--c-phase-3)" />
    </marker>
    <marker id="arrRet" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="var(--c-ret-glow)" />
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="650" fill="var(--c-bg)" />
  <rect x="0" y="0" width="760" height="650" fill="url(#grid)" />

  <path d="M14 40 V14 H40" fill="none" stroke="var(--c-hud)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M720 40 V14 H746" fill="none" stroke="var(--c-hud)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M14 610 V636 H40" fill="none" stroke="var(--c-hud)" stroke-width="1.2" stroke-linecap="round" />
  <path d="M720 610 V636 H746" fill="none" stroke="var(--c-hud)" stroke-width="1.2" stroke-linecap="round" />

  <path class="flow" d="M90 80 L115 198" fill="none" stroke="var(--c-phase-1)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrAuth)" />
  <path class="flow" d="M190 212 L308 82" fill="none" stroke="var(--c-phase-1)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrAuth)" />
  <path d="M192 62 L120 198" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />
  <path class="flow" d="M190 235 H320" fill="none" stroke="var(--c-phase-2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrDisc)" />
  <path class="flow" d="M480 215 L568 85" fill="none" stroke="var(--c-phase-2)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrDisc)" />
  <path d="M568 110 L482 245" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />
  <path d="M320 245 H192" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />
  <path class="flow" d="M190 295 H320" fill="none" stroke="var(--c-phase-3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrInvoke)" />
  <path class="flow" d="M480 285 L568 135" fill="none" stroke="var(--c-phase-3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrInvoke)" />
  <path d="M568 160 L482 305" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />
  <path class="flow" d="M480 315 L568 415" fill="none" stroke="var(--c-phase-3)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrInvoke)" />
  <path d="M568 445 L482 330" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />
  <path d="M320 330 H192" fill="none" stroke="var(--c-ret)" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7" marker-end="url(#arrRet)" />

  <!-- 唯一循环时钟；每步只播放一次，在下一轮 repeatEvent 时重新触发。 -->
  <g visibility="hidden"><animate id="flowCycle" attributeName="opacity" from="0" to="0" begin="0s" dur="20s" repeatCount="indefinite" /></g>
  <g class="particles">
    <g data-step="1" visibility="hidden" style="color:var(--c-phase-1)">
      <set attributeName="visibility" to="visible" begin="0s;flowCycle.repeatEvent" dur="1.2s" />
      <animateMotion dur="1.2s" begin="0s;flowCycle.repeatEvent" path="M90 80 L115 198" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">1</text>
    </g>
    <g data-step="2" visibility="hidden" style="color:var(--c-phase-1)">
      <set attributeName="visibility" to="visible" begin="1.3s;flowCycle.repeatEvent+1.3s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="1.3s;flowCycle.repeatEvent+1.3s" path="M190 212 L308 82" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">2</text>
    </g>
    <g data-step="3" visibility="hidden" style="color:var(--c-ret-core)">
      <set attributeName="visibility" to="visible" begin="2.6s;flowCycle.repeatEvent+2.6s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="2.6s;flowCycle.repeatEvent+2.6s" path="M192 62 L120 198" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">3</text>
    </g>
    <g data-step="4" visibility="hidden" style="color:var(--c-phase-2)">
      <set attributeName="visibility" to="visible" begin="4.5s;flowCycle.repeatEvent+4.5s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="4.5s;flowCycle.repeatEvent+4.5s" path="M190 235 H320" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">4</text>
    </g>
    <g data-step="5" visibility="hidden" style="color:var(--c-phase-2)">
      <set attributeName="visibility" to="visible" begin="5.8s;flowCycle.repeatEvent+5.8s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="5.8s;flowCycle.repeatEvent+5.8s" path="M480 215 L568 85" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">5</text>
    </g>
    <g data-step="6" visibility="hidden" style="color:var(--c-ret-core)">
      <set attributeName="visibility" to="visible" begin="7.1s;flowCycle.repeatEvent+7.1s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="7.1s;flowCycle.repeatEvent+7.1s" path="M568 110 L482 245" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">6</text>
    </g>
    <g data-step="7" visibility="hidden" style="color:var(--c-ret-core)">
      <set attributeName="visibility" to="visible" begin="8.4s;flowCycle.repeatEvent+8.4s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="8.4s;flowCycle.repeatEvent+8.4s" path="M320 245 H192" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">7</text>
    </g>
    <g data-step="8" visibility="hidden" style="color:var(--c-phase-3)">
      <set attributeName="visibility" to="visible" begin="10.3s;flowCycle.repeatEvent+10.3s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="10.3s;flowCycle.repeatEvent+10.3s" path="M190 295 H320" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">8</text>
    </g>
    <g data-step="9" visibility="hidden" style="color:var(--c-phase-3)">
      <set attributeName="visibility" to="visible" begin="11.6s;flowCycle.repeatEvent+11.6s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="11.6s;flowCycle.repeatEvent+11.6s" path="M480 285 L568 135" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">9</text>
    </g>
    <g data-step="10" visibility="hidden" style="color:var(--c-ret-core)">
      <set attributeName="visibility" to="visible" begin="12.9s;flowCycle.repeatEvent+12.9s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="12.9s;flowCycle.repeatEvent+12.9s" path="M568 160 L482 305" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">10</text>
    </g>
    <g data-step="11" visibility="hidden" style="color:var(--c-phase-3)">
      <set attributeName="visibility" to="visible" begin="14.2s;flowCycle.repeatEvent+14.2s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="14.2s;flowCycle.repeatEvent+14.2s" path="M480 315 L568 415" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">11</text>
    </g>
    <g data-step="12" visibility="hidden" style="color:var(--c-ret-core)">
      <set attributeName="visibility" to="visible" begin="15.5s;flowCycle.repeatEvent+15.5s" dur="1.2s" />
      <animateMotion dur="1.2s" begin="15.5s;flowCycle.repeatEvent+15.5s" path="M568 445 L482 330" />
      <circle r="14" fill="currentColor" opacity=".35" /><circle class="badge" r="10" /><text class="stepNumber">12</text>
