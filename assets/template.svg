  <text class="note" x="40" y="500">认证 1–3；场景 A：发现 4–7；场景 B：调用 8–13（假定鉴权允许）。</text>
  <text class="note" x="40" y="520">两个场景分段演示，不表示发现必然先于调用；每步 1.2s，整轮 20s。</text>
  <text class="note" x="40" y="560">编号不等于严格时序图：编号与动画表示逻辑调用顺序，</text>
  <text class="note" x="40" y="580">不代表真实耗时、精确时间比例或完整的并发时序。</text>

  <!-- 明暗主题切换按钮（浏览器直接打开 SVG 时可用；作为 <img> 引用时 JS 不执行，但仍跟随系统） -->
